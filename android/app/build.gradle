plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abierto.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.abierto.app"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "1.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("abierto-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "changeme"
            keyAlias System.getenv("KEY_ALIAS") ?: "abierto-key"
            keyPassword System.getenv("KEY_PASSWORD") ?: "changeme"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.android.play:integrity:1.4.0'
}
